[package]
name = "eroverlay-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "EROverlay"
crate-type = ["cdylib", "rlib"]

[features]
# Controlled local-hook DLL fixture; excluded from the installation build.
native-lifecycle-fixture = []

[dependencies]
eroverlay-abi.workspace = true
eroverlay-game.workspace = true
eroverlay-renderer.workspace = true
windows = { workspace = true, features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_LibraryLoader", "Win32_System_Threading", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging", "Win32_System_Console", "Win32_System_Diagnostics_Debug", "Win32_System_Memory", "Win32_System_SystemServices"] }

[lints]
workspace = true
