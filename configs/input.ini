# Key names map to Win32 Virtual-Key codes and can be combined with '+' for shortcuts,
# e.g. CTRL+SHIFT+[
#
# Available key names:
#   Mouse:       LBUTTON (or LMB), RBUTTON (or RMB), MBUTTON (or MMB), XBUTTON1, XBUTTON2
#   Letters:     A-Z
#   Digits:      0-9
#   Function:    F1-F24
#   Numpad:      NUMPAD0-NUMPAD9 (or NUM0-NUM9), MULTIPLY, ADD, SEPARATOR, SUBTRACT, MINUS, DECIMAL, DIVIDE
#   Navigation:  LEFT, UP, RIGHT, DOWN, HOME, END, PAGEUP (or PRIOR), PAGEDOWN (or NEXT), INSERT (or INS), DELETE (or DEL)
#   Modifiers:   CTRL (or CONTROL), ALT, SHIFT, WIN  (combinable with '+')
#   Editing:     BACK (or BACKSPACE), TAB, CLEAR, RETURN (or ENTER), SPACE, ESCAPE (or ESC)
#   IME:         KANA, HANGUL, JUNJA, FINAL, HANJA, KANJI, CONVERT, NONCONVERT, ACCEPT, MODECHANGE, PROCESSKEY, PACKET
#   Toggle:      CAPITAL (or CAPSLOCK), NUMLOCK, SCROLL
#   System:      PAUSE, PRINT (or PRINTSCREEN/SNAPSHOT), CANCEL, APPS, SLEEP, SELECT, EXECUTE, HELP, ATTN, CRSEL, EXSEL, EREOF, PLAY, ZOOM, PA1
#   Browser:     BROWSER_BACK, BROWSER_FORWARD, BROWSER_REFRESH, BROWSER_STOP, BROWSER_SEARCH, BROWSER_FAVORITES, BROWSER_HOME
#   Media:       VOLUME_MUTE, VOLUME_DOWN, VOLUME_UP, MEDIA_NEXT_TRACK, MEDIA_PREV_TRACK, MEDIA_STOP, MEDIA_PLAY_PAUSE
#   Launch:      LAUNCH_MAIL, LAUNCH_MEDIA_SELECT, LAUNCH_APP1, LAUNCH_APP2
#   Symbols:     =  +  ,  -  .  ;  /  ~  `  [  \  ]  '
#   OEM names:   OEM_1, OEM_PLUS, OEM_COMMA, OEM_MINUS, OEM_PERIOD, OEM_2, OEM_3, OEM_4, OEM_5, OEM_6, OEM_7, OEM_8, OEM_CLEAR
#
# Side-specific keys (LWIN, RWIN, LALT, RALT, LCTRL, RCTRL, LSHIFT, RSHIFT;
# also LMENU/RMENU and LCONTROL/RCONTROL aliases) can only be used as standalone
# keys — they CANNOT be used as modifiers in key combinations.
# Note: MINUS means numpad subtract; use '-' or OEM_MINUS for the main keyboard minus key.

# Key to unload the mod at runtime. Leave empty to disable.
unload=
