# Global shortcut and key-name reference.
# Save as UTF-8 and restart the game after editing.
# Put comments on separate lines starting with # or ;.
# Chinese-comment templates: copy the matching file from configs_CN/ to configs/.

# Unload EROverlay and its plugins during play. Leave empty to disable.
# Example: unload=CTRL+SHIFT+F12
# Shortcuts respond only while the game is in the foreground.
unload=

# Writing a shortcut
# Use one key name, such as M or F8, or modifiers plus one key, such as CTRL+SHIFT+F8.
# Key names are case-insensitive. Do not put spaces around the '+' separators.
# Modifiers: CTRL (or CONTROL), ALT, SHIFT, WIN.
# Extra held modifiers prevent a match: CTRL+M requires Ctrl and M, without Shift/Alt/Win.
# These names also apply to the shortcuts in boss.ini and minimap.ini.

# Common key names (aliases in parentheses)
# Letters: A-Z.   Digits: 0-9.   Function keys: F1-F24.
# Mouse: LBUTTON (LMB), RBUTTON (RMB), MBUTTON (MMB), XBUTTON1, XBUTTON2.
# Navigation: LEFT, UP, RIGHT, DOWN, HOME, END, PAGEUP (PRIOR), PAGEDOWN (NEXT).
# Editing: INSERT (INS), DELETE (DEL), BACK (BACKSPACE), TAB, CLEAR,
#          RETURN (ENTER), SPACE, ESCAPE (ESC).
# Lock keys: CAPITAL (CAPSLOCK), NUMLOCK, SCROLL.

# Numpad
# NUMPAD0-NUMPAD9 (NUM0-NUM9), MULTIPLY, ADD, SEPARATOR, SUBTRACT, MINUS, DECIMAL, DIVIDE.
# MINUS and SUBTRACT mean numpad subtract. Use '-' or OEM_MINUS for the main minus key.

# Punctuation and OEM keys
# Single-key symbols: =  ,  -  .  ;  /  ~  `  [  \  ]  '
# OEM names: OEM_1, OEM_PLUS, OEM_COMMA, OEM_MINUS, OEM_PERIOD, OEM_2, OEM_3,
#            OEM_4, OEM_5, OEM_6, OEM_7, OEM_8, OEM_CLEAR.
# Symbols identify Win32 keys; their labels depend on the keyboard layout.
# '+' is the shortcut separator. Bind that key with OEM_PLUS, alone or as CTRL+OEM_PLUS.
# In a setting such as toggle_full_mode==, the first '=' is the separator and the value is '='.

# Left/right modifier keys
# Standalone only: LWIN, RWIN, LALT, RALT, LCTRL, RCTRL, LSHIFT, RSHIFT.
# Aliases: LMENU/RMENU for LALT/RALT; LCONTROL/RCONTROL for LCTRL/RCTRL.
# For combinations, use the generic CTRL, ALT, SHIFT and WIN names above.

# Additional key names
# System: PAUSE, PRINT (PRINTSCREEN or SNAPSHOT), CANCEL, APPS, SLEEP, SELECT,
#         EXECUTE, HELP, ATTN, CRSEL, EXSEL, EREOF, PLAY, ZOOM, PA1.
# Browser: BROWSER_BACK, BROWSER_FORWARD, BROWSER_REFRESH, BROWSER_STOP,
#          BROWSER_SEARCH, BROWSER_FAVORITES, BROWSER_HOME.
# Media: VOLUME_MUTE, VOLUME_DOWN, VOLUME_UP, MEDIA_NEXT_TRACK, MEDIA_PREV_TRACK,
#        MEDIA_STOP, MEDIA_PLAY_PAUSE.
# Launch: LAUNCH_MAIL, LAUNCH_MEDIA_SELECT, LAUNCH_APP1, LAUNCH_APP2.
# Input method: KANA, HANGUL, JUNJA, FINAL, HANJA, KANJI, CONVERT, NONCONVERT,
#               ACCEPT, MODECHANGE, PROCESSKEY, PACKET.
