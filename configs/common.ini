# Shared settings for all EROverlay plugins.
# Save as UTF-8 and restart the game after editing.
# Put comments on separate lines starting with # or ;.
# Chinese-comment templates: copy the matching file from configs_CN/ to configs/.

# Console
# true: open a console for startup messages and troubleshooting. false: keep it closed.
console=false

# Font and character set
# Custom font path: relative to data/, or a full drive path such as D:/Fonts/MyFont.ttf.
# Supports .ttf, .ttc and .otf files. The font must contain the characters you display.
# Leave empty for the default font selection:
#   Japanese, Korean, Thai and Chinese try Windows fonts (Segoe UI and fallbacks).
#   Other character sets use the embedded font. It is also used if no system font loads.
font=

# Font size in pixels. Larger values enlarge text throughout the overlay.
# Use a positive number, for example 20 or 24.5.
font_size=20

# Choose which characters to load into the font. Leave empty to follow the game language.
# Copy a code exactly as shown:
#   enUS: Latin text, including English, French, German, Spanish, Italian and Portuguese.
#   plPL: Latin text with Polish characters.   ruRU: Cyrillic text.
#   jaJP: Japanese.   koKR: Korean.   thTH: Thai.
#   zhCN or zhTW: Chinese, including simplified and traditional characters.
# This selects font characters; it does not select the language of data files below.
charset=

# Data language
# Language folder for boss and region names. Leave empty to follow the game language.
# Use a folder name under data/, for example engUS, zhoCN, zhoTW or jpnJP.
# These are data-folder codes, not the font codes above: zhoCN here, zhCN for charset.
# Changing the comment language or copying a configs_CN/ file does not change this setting.
language=
