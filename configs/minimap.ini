# Minimap settings / 小地图设置
# Save as UTF-8. Restart the game to apply changes.
# 使用 UTF-8 保存；修改后重启游戏生效。
# This is the new sectioned format. Replace the old file; old keys are ignored.
# 这是新的分区格式，请替换旧文件；旧键名不再读取。
# Full guide: README.md / 中文说明：README_CN.md（源码中位于 src/minimap/）
# Put comments on their own lines. Do not add comments after a value.
# 注释放在单独一行，不要写在配置值后面。


# 1. Keyboard shortcuts / 快捷键
[controls]
# M cycles compact -> large -> hidden -> compact with the defaults below.
# 默认按 M 循环：小地图 → 居中大地图 → 隐藏 → 小地图。
# When toggle and cycle use different keys, toggle only shows/hides the map.
# 两项设为不同按键时，toggle 只负责显示/隐藏，cycle 只负责切换预设。
# Use letters, F1-F24 or combinations such as CTRL+M. Leave empty to disable.
# 可填字母、F1～F24 或 CTRL+M 等组合键；留空表示禁用该快捷键。
toggle = M
cycle = M

# Both use N: one press shows/hides graces and landmarks together.
# 默认都用 N，一次按键同时切换赐福和地标；也可设置不同按键。
toggle_graces = N
toggle_landmarks = N


# 2. Terrain / 地图底图
[map]
# false: follow obtained fragments. true: reveal all minimap terrain.
# false：跟随已获得的地图碎片；true：小地图底图全开。
# Covers surface, underground and DLC. Does not change saves or discovery.
# 包括地表、地下和 DLC；不修改存档，不解锁赐福或地标。
full_map = false


# 3. Markers / 标记
[markers]
# true = show, false = hide. Graces/landmarks must be discovered in-game.
# true 表示显示，false 表示隐藏；赐福和地标仍遵循游戏发现状态。
graces = true
landmarks = true
# Dropped runes; disappears after recovery. / 卢恩死亡位置，回收后消失。
death = true
# Numbered beacons 1-5 placed in the game's world map. / 大地图放置的编号标记 1～5。
beacons = true


# 4. Border, shared by all presets / 边框，所有预设共用
[border]
# Red, green, blue, alpha: four integers from 0 to 255. Alpha 0 is invisible.
# 红、绿、蓝、透明度：四个 0～255 的整数；透明度 0 表示不可见。
color = 255, 255, 255, 100
# Width in pixels; 0 removes the border. / 像素宽度，0 表示关闭边框。
width = 1.5


# 5. Preset order / 显示预设的切换顺序
[presets]
# The first preset is used at startup. Only listed presets are used.
# 启动使用第一个预设；只使用这里列出的预设，顺序就是按键切换顺序。
# Add a preset by copying a [preset.name] block and adding its name here.
# 新增预设：复制一个 [preset.名称] 分区，换名称，再将名称加入下面的列表。
# Names use letters, digits, underscores or hyphens, and are case-sensitive.
# 名称使用英文字母、数字、下划线或连字符，区分大小写。
# With the same toggle/cycle key, a hidden step is added unless zoom=0 exists.
# 显示键和切换键相同时，自动加入隐藏步骤；已有 zoom=0 预设时不再添加。
order = compact, large


# 6. Compact preset / 小地图预设
# Each preset is independent. Missing values use the defaults shown below.
# 每个预设独立填写；省略的字段使用本分区展示的默认值，不继承其他预设。
# Keep at least one setting in each preset. / 每个预设至少保留一项设置。
[preset.compact]
# Width and height relative to the game's 16:9 reference height.
# 宽高相对于游戏画面的 16:9 基准高度；宽度不是相对于屏幕宽度。
# 30% = 0.30. At 1920x1080 this gives 324x324 pixels.
# 30% 与 0.30 等价；1920×1080 下为 324×324 像素。
width = 30%
height = 30%
# margins = use edge margins below; center = screen center, ignoring margins.
# margins：按下方边距定位；center：屏幕居中，忽略所有边距。
position = margins
# Fill ONE of left/right and ONE of top/bottom; leave the other side empty.
# 左右边距选一项填写，上下边距选一项填写；另一侧留空。
# right + top anchors the map's upper-right corner; left + bottom its lower-left.
# 右＋上：相对于屏幕右上角定位，小地图锚点也为右上角；左＋下同理使用左下角。
# 24 or 24px = 24 pixels; 2% = 2% of full screen width (left/right) or height (top/bottom).
# 24 或 24px 表示 24 像素；2% 相对于完整屏幕宽度（左右）或高度（上下）。
# Positive values move inward; negative values move outward. 0 selects the edge.
# 正值向画面内移动，负值向外移动；0 也会选中该侧，留空才表示不使用。
# If both sides are empty, use right=0 or top=0. If both are filled, left/top wins.
# 某个轴的两侧均留空时，使用右边距 0 或上边距 0；两侧都填写时，左侧/上侧优先。
margin_left =
margin_right = 0
margin_top = 0
margin_bottom =
# Larger zoom enlarges terrain and shows LESS area in the same map window.
# zoom 越大，地图细节越大，同样大小的窗口看到的范围越小；0 表示隐藏。
zoom = 0.75
# 0% = invisible, 100% = opaque; decimals 0-1 are also accepted.
# 0% 完全透明，100% 完全不透明；也可填写 0～1 的小数。
opacity = 80%
# true: camera-forward stays up, forces a circle and shows the compass.
# true：镜头前方始终朝上，自动使用圆形，并显示方位指示。
rotate = false
# rect = rectangle, rounded = rounded rectangle, circle = circle.
# rect：矩形；rounded：圆角矩形；circle：圆形。圆形采用宽高中较小的值。
shape = rect
# Used only for rounded. 20% of half the shorter side, or pixels such as 30px.
# 只在 rounded 时生效；20% 表示较短边一半的 20%，也可填写 30px 等像素值。
rounding = 20%

# Optional size adjustments. 1 = normal; 1.5 = 150%; 0 = hide that icon group.
# 细调倍数：1 为原大小，1.5 为 150%；图标组设为 0 时隐藏该组。
# map_scale multiplies zoom and also affects icons that follow map zoom.
# map_scale 与 zoom 相乘，也会影响跟随地图缩放的图标；有效缩放限制在 0.01～16。
map_scale = 1
# Graces, landmark symbols and the Roundtable icon; area symbols follow terrain.
# 赐福、普通地标和圆桌厅图标；范围型地标仍随底图缩放。
decoration_scale = 1
# Player dot/arrow, death marker and numbered beacons.
# 玩家点和方向箭头、死亡标记、编号标记。
player_scale = 1
# Compass size, used only when rotate=true. / 方位指示大小，仅 rotate=true 时显示。
compass_scale = 1


# 7. Large centered preset / 居中大地图预设
[preset.large]
width = 90%
height = 90%
# Center ignores all margin settings. / 居中模式忽略所有边距设置。
position = center
zoom = 1.5
opacity = 60%
rotate = false
shape = rect
rounding = 20%
map_scale = 1
decoration_scale = 1
player_scale = 1
compass_scale = 1


# 8. Troubleshooting, normally leave empty / 故障排查，平时留空
[diagnostics]
# Optional log path, e.g. D:/Logs/minimap.log; the parent folder must exist.
# 可选日志路径，例如 D:/Logs/minimap.log；上级文件夹需要已存在。
# Records resource requests and map state. Leave empty to disable file logging.
# 记录资源请求和地图状态；留空关闭文件日志。
log_file =
