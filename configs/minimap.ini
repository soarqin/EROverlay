# Minimap settings.
# Save as UTF-8 and restart the game after editing.
# Put comments on separate lines starting with # or ;. Do not add comments after values.
# Chinese-comment templates: copy the matching file from configs_CN/ to configs/.
# This sectioned format replaces the old file; flat keys and parallel value lists are ignored.
# Full guide: README.md in the Minimap package, or src/minimap/README.md in the source tree.

# Keyboard shortcuts
[controls]
# Default: M cycles compact -> large -> hidden -> compact.
# With different keys, toggle shows/hides the map and cycle switches display presets.
# Use M, F8 or combinations such as CTRL+M; see input.ini for key names.
# Leave a shortcut empty, or set it to none, to disable it.
toggle = M
cycle = M

# These both use N, so one press toggles grace and landmark markers together.
# Assign different keys to control them separately.
toggle_graces = N
toggle_landmarks = N

# Terrain
[map]
# false: follow obtained map fragments. true: show fully revealed terrain on the minimap.
# Includes surface, underground and DLC maps. Does not grant fragments or change saves.
# Marker discovery still follows the game.
full_map = false

# Marker visibility: true shows the group; false hides it.
[markers]
# Grace and landmark visibility still follows the game's discovery and display rules.
graces = true
landmarks = true

# Show dropped runes on their map layer until they are recovered or the death record is cleared.
death = true

# Show numbered beacons 1-5 placed in the game's world map. Place and delete them there.
beacons = true

# Border shared by all display presets
[border]
# Red, green, blue, alpha: four integers from 0 to 255. Alpha 0 hides the border.
# Border alpha is independent of the preset's opacity.
color = 255, 255, 255, 100

# Width in pixels; 0 removes the border.
width = 1.5

# Startup and preset cycling
[presets]
# The first name is used at startup. Only listed names are used, in this order.
# To add a preset, copy a [preset.name] block, rename it and add that name here.
# Names are case-sensitive: up to 64 ASCII letters, digits, underscores or hyphens.
# Each preset is independent; omitted fields use the compact field defaults below.
# Keep at least one setting in each block. Undefined names are skipped; duplicates are used once.
# With the same nonempty toggle/cycle key, a hidden step is appended unless a preset has zoom=0.
# To put the hidden step elsewhere, add a named preset with zoom=0 at that point in the order.
order = compact, large

# Compact display preset
[preset.compact]
# Width, height and percentage margins share the shorter screen side: min(width, height).
# 30% equals 0.30. At 1920x1080, these settings give a 324x324-pixel map.
# The same percentage gives the same pixel length horizontally and vertically.
width = 30%
height = 30%

# margins: position using the edges below. center: center on screen and ignore all margins.
position = margins

# Choose one horizontal edge (left/right) and one vertical edge (top/bottom).
# The map's matching corner is the anchor, retained when its size or shape changes.
# right + top: upper right. left + top: upper left. right + bottom: lower right.
# left + bottom: lower left. Leave the opposite edges empty; 0 explicitly selects an edge.
# 24 or 24px means 24 pixels; every percentage margin uses the same reference as width/height.
# At 1920x1080, 5% means 54 pixels for any edge, regardless of the map's own size.
# Positive margins move inward; negative margins move outward and may be clipped.
# If neither edge is set on an axis, use right=0 or top=0.
# If both are valid, left/top takes precedence with a console message; the map is not stretched.
margin_left =
margin_right = 0
margin_top = 0
margin_bottom =

# Larger zoom enlarges details and shows less area in the same window. 0 hides this preset.
zoom = 0.75

# Map opacity: 0% is transparent, 100% is opaque. Decimals from 0 to 1 also work.
opacity = 80%

# true: keep camera-forward up, use a circle and show the compass.
rotate = false

# rect: rectangle. rounded: rounded rectangle. circle: use the smaller width/height as diameter.
# rotate=true always selects a circle, regardless of this setting.
shape = rect

# Corner radius for shape=rounded only. 20% means 20% of half the shorter side.
# You can also use pixels, such as 30px or 30.
rounding = 20%

# Size adjustments: 1 is normal, 1.5 is 150%. Use nonnegative numbers.
# Multiply terrain zoom and map-scaled icons by this value; effective zoom is limited to 0.01-16.
map_scale = 1

# Grace, ordinary landmark and Roundtable icons. Area symbols still follow terrain zoom.
# 0 hides this icon group.
decoration_scale = 1

# Player dot/arrow, death marker and numbered beacons. 0 hides this icon group.
player_scale = 1

# Compass size, shown only with rotate=true. 0 hides it.
compass_scale = 1

# Large centered preset: same fields and units as above, with a larger view.
[preset.large]
width = 90%
height = 90%
position = center
zoom = 1.5
opacity = 60%
rotate = false
shape = rect
rounding = 20%
map_scale = 1
decoration_scale = 1
player_scale = 1
compass_scale = 1

# Troubleshooting
[diagnostics]
# Optional resource/map-state log. Leave empty to disable file logging.
# Example: D:/Logs/minimap.log. Create the parent folder first.
# Relative paths use the game's working directory. Configuration errors appear in the console;
# set console=true in common.ini to see them.
log_file =
