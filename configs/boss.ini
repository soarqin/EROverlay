# Boss progress and named health-bar encounters. UTF-8.
# Game parameters, event scripts and current game-language text provide the list.
# '=' is the default full-list shortcut; NONE disables a shortcut.
toggle_full_mode==
toggle=NONE

# Runtime settings edited in the egui panel are saved in configs/boss-ui.json.
# Remove that file to use these INI values again.
allow_revive=false
challenge_mode=false
challenge_death_count=0

# Logical pixels. The full panel can also be dragged and resized with egui.
width=440
height=800
font_size=20
opacity=0.95

# Available placeholders: kills, total, deaths, igt, pb, tries. $n inserts a line.
boss_kill_text={kills}/{total}
challenge_status_text=PB: {pb}/{total}  Tries: {tries}$nCurrent: {kills}/{total}

# Extra revival flags stay in configs/boss-revival.json.
# A missing recipe disables revival for that encounter; [] explicitly allows
# only clearing the primary defeat flag. Back up saves before editing recipes.
