# Shared ImGui panel style.
# Save as UTF-8 and restart the game after editing.
# Put comments on separate lines starting with # or ;.
# Chinese-comment templates: copy the matching file from configs_CN/ to configs/.
# Minimap border and shape settings are in minimap.ini.

# Color values: red, green, blue, alpha (four integers from 0 to 255).
# Alpha controls opacity: 0 is invisible, 255 is opaque.
# Example: 255,255,255,128 is translucent white. Keep all four values.

# Text and panels
# Default text color; individual overlays may use their own colors for some text.
text_color=191,191,74,230

# Check mark inside a checked box.
check_mark_color=189,189,74,230

# Panel background.
bg_color=26,26,26,77

# Panel outline.
border_color=255,255,255,64

# Buttons: idle, mouse hover, and held/pressed states.
button_color=13,13,13,112
button_hover_color=48,48,48,112
button_press_color=51,56,59,230

# Expandable tree rows: idle, mouse hover, and held/pressed states.
node_color=0,0,0,133
node_hover_color=0,0,0,92
node_press_color=51,56,59,84

# Scrollbars
# Track background.
scroll_bg_color=13,13,13,112

# Draggable thumb: idle, mouse hover, and held/pressed states.
scroll_color=87,87,87,112
scroll_hover_color=102,102,102,112
scroll_press_color=143,143,143,112

# Panel geometry
# Window border width in pixels. Use a nonnegative number; 0 removes the border.
border_width=1

# Window corner radius in pixels. Use a nonnegative number; 0 gives square corners.
rounding=7
