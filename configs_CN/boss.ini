# Boss 进度与具名大生命条战斗。请保存为 UTF-8。
# 列表从游戏 Param、事件脚本和当前游戏语言的文本资源生成。
# 默认按 = 切换紧凑状态与完整列表；NONE 禁用快捷键。
toggle_full_mode==
toggle=NONE

# 在 egui 面板修改的设置保存到 configs/boss-ui.json。
# 删除该文件后重新使用本 INI 的设置。
allow_revive=false
challenge_mode=false
challenge_death_count=0

# 逻辑像素。完整窗口也可直接拖动和调整大小。
width=440
height=800
font_size=20
opacity=0.95

# 占位符：kills、total、deaths、igt、pb、tries。$n 换行。
boss_kill_text={kills}/{total}
challenge_status_text=PB: {pb}/{total}  Tries: {tries}$nCurrent: {kills}/{total}

# 复活的额外旗标保留在 configs/boss-revival.json。
# 缺少配方时禁用该战斗的复活；[] 表示已明确只清除主击败旗标。
# 修改复活配方前请备份存档。
