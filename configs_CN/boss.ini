# Boss 覆盖层设置。
# 使用方法：复制本文件到加载器旁的 configs/，保留文件名，再修改需要的设置。
# 程序读取 configs/；configs_CN/ 保存中文注释模板，键名和默认值与英文版一致。
# 使用 UTF-8 保存，修改后重启游戏。注释单独成行，以 # 或 ; 开头。

# 显示与交互
# 切换紧凑状态行和可展开的完整 Boss 列表。
# 可用 F8、CTRL+M 等按键；完整按键名称见 input.ini。
# 下方设置将快捷键设为 =：第一个 = 分隔配置项名称和值，第二个 = 是按键。
# 填写 NONE 可禁用该快捷键；留空则恢复默认的 = 键。
toggle_full_mode==

# data/<language>/ 中的 Boss 数据文件名；语言由 common.ini 设置。
data_file=bosses.json

# true：允许在完整列表中点击已击败 Boss 的勾选框，重置其击败状态。
# 修改游戏中的击败标记前，会弹出确认窗口。
# false：不允许重置。
allow_revive=false

# 面板布局：x, y, width, height，共四个值，以逗号分隔。
# 可用 10 等像素值，或 15% 等百分比；水平方向相对于屏幕宽度，垂直方向相对于高度。
# 0 与 1 之间的小数是屏幕比例：0.15 也表示 15%，不是 0.15 像素。
# 百分比的绝对值应小于 100%；100% 会被解析为 1 像素。
# x/y 为正值时从左侧/顶部定位；负值时以面板右侧/底部为锚点定位。
# 宽高用于完整列表，某一项设为 0 时该方向按内容自动调整。
# 紧凑状态行始终按内容调整尺寸，使用相同的位置和锚点。
# 默认：距右侧和顶部各 10 像素，宽为屏幕的 15%，高为屏幕的 90%。
panel_pos=-10,10,15%,90%

# 状态文字
# 普通模式下显示的文字；占位符名称和花括号保持原样。
#   {kills}：已击败 Boss 数；{total}：已加载数据集中的 Boss 总数。
#   {deaths}：当前存档的死亡次数；挑战模式中为本次尝试的死亡次数。
#   {igt}：游戏时间，显示为 MM:SS 或 HH:MM:SS；$n：换行。
# 示例：已击败：{kills}/{total}$n死亡次数：{deaths}
boss_kill_text={kills}/{total}

# 挑战模式
# true：显示 challenge_status_text，记录未超过死亡上限时的个人最佳成绩。
# 超过上限后，当前 Boss 击败数量仍会更新，但不会提高个人最佳成绩。
# false：显示 boss_kill_text，死亡次数使用普通模式下的存档总次数。
challenge_mode=false

# 每次挑战允许的最大死亡次数；填写非负整数。
# 0 表示不允许死亡，1 表示允许死亡一次；再死亡一次时计为一次失败尝试。
challenge_death_count=0

# challenge_mode=true 时显示的文字，也支持上面列出的占位符。
#   {pb}：各次尝试中，未超过死亡上限时达到的最高 Boss 击败数量。
#   {tries}：失败尝试次数。
# 个人最佳成绩和尝试次数保存在加载器旁的 Challenge.txt 中。
# 默认文字先显示最佳成绩和失败次数，再显示当前 Boss 击败数量。
challenge_status_text=PB: {pb}/{total}  Tries: {tries}$nCurrent: {kills}/{total}
