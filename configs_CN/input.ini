# 全局快捷键设置与按键名称参考。
# 使用方法：复制本文件到加载器旁的 configs/，保留文件名，再修改需要的设置。
# 程序读取 configs/；configs_CN/ 保存中文注释模板，键名和默认值与英文版一致。
# 使用 UTF-8 保存，修改后重启游戏。注释单独成行，以 # 或 ; 开头。

# 游戏运行时卸载 EROverlay 及其插件；留空表示禁用。
# 示例：unload=CTRL+SHIFT+F12
# 快捷键仅在游戏位于前台时响应。
unload=

# 快捷键的写法
# 可填写 M、F8 等单个按键，也可填写修饰键加一个按键，例如 CTRL+SHIFT+F8。
# 按键名称不区分大小写，+ 两侧不要加空格。
# 修饰键：CTRL（也可用 CONTROL）、ALT、SHIFT、WIN。
# 额外按住其他修饰键时不会匹配：CTRL+M 要求按住 Ctrl 和 M，不同时按 Shift/Alt/Win。
# 这些名称也适用于 boss.ini 和 minimap.ini 中的快捷键。

# 常用按键名称，括号内为别名
# 字母：A-Z；数字：0-9；功能键：F1-F24。
# 鼠标：LBUTTON（LMB）、RBUTTON（RMB）、MBUTTON（MMB）、XBUTTON1、XBUTTON2。
# 导航：LEFT、UP、RIGHT、DOWN、HOME、END、PAGEUP（PRIOR）、PAGEDOWN（NEXT）。
# 编辑：INSERT（INS）、DELETE（DEL）、BACK（BACKSPACE）、TAB、CLEAR、
#       RETURN（ENTER）、SPACE、ESCAPE（ESC）。
# 锁定键：CAPITAL（CAPSLOCK）、NUMLOCK、SCROLL。

# 数字键盘
# NUMPAD0-NUMPAD9（NUM0-NUM9）、MULTIPLY、ADD、SEPARATOR、SUBTRACT、MINUS、DECIMAL、DIVIDE。
# MINUS 和 SUBTRACT 指数字键盘减号；主键盘减号用 - 或 OEM_MINUS。

# 标点与 OEM 按键
# 单键符号：=  ,  -  .  ;  /  ~  `  [  \  ]  '
# OEM 名称：OEM_1、OEM_PLUS、OEM_COMMA、OEM_MINUS、OEM_PERIOD、OEM_2、OEM_3、
#           OEM_4、OEM_5、OEM_6、OEM_7、OEM_8、OEM_CLEAR。
# 符号对应 Win32 按键，键帽上的字符取决于键盘布局。
# + 用于分隔组合键；绑定该符号键时写 OEM_PLUS，可独立使用，也可写 CTRL+OEM_PLUS。
# toggle_full_mode== 这类配置中，第一个 = 是分隔符，配置值是第二个 =。

# 左右侧修饰键
# 仅作为独立按键：LWIN、RWIN、LALT、RALT、LCTRL、RCTRL、LSHIFT、RSHIFT。
# 别名：LMENU/RMENU 对应 LALT/RALT，LCONTROL/RCONTROL 对应 LCTRL/RCTRL。
# 组合键使用上面的通用名称 CTRL、ALT、SHIFT 和 WIN。

# 其他按键名称
# 系统：PAUSE、PRINT（PRINTSCREEN 或 SNAPSHOT）、CANCEL、APPS、SLEEP、SELECT、
#       EXECUTE、HELP、ATTN、CRSEL、EXSEL、EREOF、PLAY、ZOOM、PA1。
# 浏览器：BROWSER_BACK、BROWSER_FORWARD、BROWSER_REFRESH、BROWSER_STOP、
#         BROWSER_SEARCH、BROWSER_FAVORITES、BROWSER_HOME。
# 媒体：VOLUME_MUTE、VOLUME_DOWN、VOLUME_UP、MEDIA_NEXT_TRACK、MEDIA_PREV_TRACK、
#       MEDIA_STOP、MEDIA_PLAY_PAUSE。
# 启动程序：LAUNCH_MAIL、LAUNCH_MEDIA_SELECT、LAUNCH_APP1、LAUNCH_APP2。
# 输入法：KANA、HANGUL、JUNJA、FINAL、HANJA、KANJI、CONVERT、NONCONVERT、
#         ACCEPT、MODECHANGE、PROCESSKEY、PACKET。
