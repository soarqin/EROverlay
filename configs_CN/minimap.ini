# 小地图设置。
# 使用方法：复制本文件到加载器旁的 configs/，保留文件名，再修改需要的设置。
# 程序读取 configs/；configs_CN/ 保存中文注释模板，键名和默认值与英文版一致。
# 使用 UTF-8 保存，修改后重启游戏。注释单独成行，以 # 或 ; 开头，不放在配置值后面。
# 这份分区配置替代旧文件；旧平铺键名和多行对应的数值列表不再读取。
# 完整说明：Minimap 分发包中的 README_CN.md，或源码中的 src/minimap/README_CN.md。

# 快捷键
[controls]
# 默认按 M 循环：小地图 -> 居中大地图 -> 隐藏 -> 小地图。
# 使用不同按键时，toggle 负责显示/隐藏，cycle 负责切换显示预设。
# 可用 M、F8 或 CTRL+M 等组合键；完整按键名称见 input.ini。
# 留空或填写 none 可禁用一个快捷键。
toggle = M
cycle = M

# 默认都使用 N，一次按键同时切换赐福和地标标记；分开控制时填写不同按键。
toggle_graces = N
toggle_landmarks = N

# 地图底图
[map]
# false：跟随已获得的地图碎片；true：小地图显示全开底图。
# 包括地表、地下和 DLC 地图；不授予地图碎片，不修改存档。
# 标记的发现状态仍跟随游戏。
full_map = false

# 标记显示开关：true 显示该组，false 隐藏该组。
[markers]
# 赐福和地标仍遵循游戏的发现状态与显示规则。
graces = true
landmarks = true

# 在对应地图层显示掉落的卢恩，回收后或游戏清除死亡记录时消失。
death = true

# 显示游戏大地图中放置的编号标记 1～5；仍需在游戏大地图中放置和删除。
beacons = true

# 边框，所有显示预设共用
[border]
# 红, 绿, 蓝, 不透明度：四个 0～255 的整数，最后一项为 0 时隐藏边框。
# 边框不透明度独立控制，不随预设的 opacity 改变。
color = 255, 255, 255, 100

# 宽度，单位为像素；0 表示不显示边框。
width = 1.5

# 启动预设与切换顺序
[presets]
# 启动使用第一个名称；只使用这里列出的预设，并按此顺序切换。
# 新增预设：复制一个 [preset.name] 分区，修改名称，再将名称加入下面的列表。
# 名称区分大小写，最多 64 个 ASCII 字母、数字、下划线或连字符。
# 每个预设独立填写；省略的字段使用下方 compact 分区展示的字段默认值。
# 每个分区至少保留一项设置；未定义名称会跳过，重复名称仅使用一次。
# toggle/cycle 使用同一个非空快捷键时，若未定义 zoom=0 的预设，会在末尾加入隐藏步骤。
# 想把隐藏步骤放在其他位置，可增加一个 zoom=0 的命名预设，并在列表中指定位置。
order = compact, large

# 小地图显示预设
[preset.compact]
# 宽高使用相同基准：min(屏幕高度, 屏幕宽度 * 9 / 16)。
# 30% 与 0.30 等价；1920×1080 下，以下设置得到 324×324 像素的小地图。
# 宽度按此基准高度的比例计算，不按屏幕宽度的比例计算。
width = 30%
height = 30%

# margins：使用下方边距定位；center：屏幕居中，忽略所有边距。
position = margins

# 水平方向选择左/右一侧，垂直方向选择上/下一侧。
# 小地图的对应角落作为锚点，尺寸或形状改变后仍保持该锚点。
# 右＋上：右上角；左＋上：左上角；右＋下：右下角；左＋下：左下角。
# 另一侧留空；0 也会明确选择该侧。
# 24 或 24px 表示 24 像素；2% 相对于完整屏幕宽度（左右）或高度（上下）。
# 正边距向画面内移动，负边距向外移动；移出画面的部分可能被裁剪。
# 一个轴的两侧都未填写时，使用右边距 0 或上边距 0。
# 两侧均为有效值时，左侧/上侧优先，并在控制台提示；小地图不会被拉伸。
margin_left =
margin_right = 0
margin_top = 0
margin_bottom =

# zoom 越大，细节越大，同样大小的窗口显示范围越小；0 隐藏该预设。
zoom = 0.75

# 地图不透明度：0% 为完全透明，100% 为完全不透明；也可填 0～1 的小数。
opacity = 80%

# true：镜头前方始终朝上，使用圆形并显示方位指示。
rotate = false

# rect：矩形；rounded：圆角矩形；circle：圆形，直径取宽高中较小的值。
# rotate=true 时始终使用圆形，不受这一项影响。
shape = rect

# 仅用于 shape=rounded 的圆角半径；20% 表示较短边一半的 20%。
# 也可填写像素值，例如 30px 或 30。
rounding = 20%

# 尺寸调整倍数：1 为原大小，1.5 为 150%；填写非负数。
# 这一项与底图缩放及随地图缩放的图标相乘；有效缩放限制在 0.01～16。
map_scale = 1

# 赐福、普通地标和圆桌厅图标；范围型标记仍随底图缩放。
# 0 隐藏这一图标组。
decoration_scale = 1

# 玩家点/方向箭头、死亡标记和编号标记；0 隐藏这一图标组。
player_scale = 1

# 方位指示大小，仅 rotate=true 时显示；0 隐藏方位指示。
compass_scale = 1

# 居中大地图预设：字段和单位与上方相同，使用更大的显示窗口。
[preset.large]
width = 90%
height = 90%
position = center
zoom = 1.5
opacity = 60%
rotate = false
shape = rect
rounding = 20%
map_scale = 1
decoration_scale = 1
player_scale = 1
compass_scale = 1

# 故障排查
[diagnostics]
# 可选的资源/地图状态日志；留空表示关闭文件日志。
# 路径示例：D:/Logs/minimap.log，上级文件夹需先创建。
# 相对路径按游戏进程工作目录解析；配置错误在控制台显示，
# 可在 common.ini 中设置 console=true 查看。
log_file =
