# 所有 EROverlay 插件共用的设置。
# 使用方法：复制本文件到加载器旁的 configs/，保留文件名，再修改需要的设置。
# 程序读取 configs/；configs_CN/ 保存中文注释模板，键名和默认值与英文版一致。
# 使用 UTF-8 保存，修改后重启游戏。注释单独成行，以 # 或 ; 开头。

# 控制台
# true：打开控制台，查看启动信息和排查提示；false：不打开。
console=false

# 字体与字符集
# 自定义字体路径：相对于 data/，或使用 D:/Fonts/MyFont.ttf 等带盘符的完整路径。
# 支持 .ttf、.ttc 和 .otf 文件；字体需要包含要显示的字符。
# 留空时自动选择字体：
#   日文、韩文、泰文和中文尝试 Windows 字体（Segoe UI 及其回退字体）。
#   其他字符集使用内置字体；未能加载系统字体时，也使用内置字体。
font=

# 字体大小，单位为像素；增大后，覆盖层中的文字会变大。
# 填写正数，例如 20 或 24.5。
font_size=20

# 选择加载到字体中的字符范围；留空跟随游戏语言。
# 按下列大小写填写代码：
#   enUS：拉丁文字，包括英文、法文、德文、西班牙文、意大利文和葡萄牙文。
#   plPL：包含波兰文字符的拉丁文字；ruRU：西里尔文字。
#   jaJP：日文；koKR：韩文；thTH：泰文。
#   zhCN 或 zhTW：中文，包含简体和繁体字符。
# 这一项选择字体字符范围，不决定下方数据文件的语言。
charset=

# 数据语言
# Boss 和区域名称的数据语言目录；留空跟随游戏语言。
# 填写 data/ 下的目录名，例如 engUS、zhoCN、zhoTW 或 jpnJP。
# 数据目录代码与字体代码不同：这里用 zhoCN，charset 使用 zhCN。
# 更换注释语言或复制 configs_CN/ 中的文件，不会改变这一项。
language=
