# ImGui 面板共用的样式。
# 使用方法：复制本文件到加载器旁的 configs/，保留文件名，再修改需要的设置。
# 程序读取 configs/；configs_CN/ 保存中文注释模板，键名和默认值与英文版一致。
# 使用 UTF-8 保存，修改后重启游戏。注释单独成行，以 # 或 ; 开头。
# 小地图的边框和形状在 minimap.ini 中设置。

# 颜色格式：红, 绿, 蓝, 不透明度，共四个 0～255 的整数。
# 最后一项控制不透明度：0 为不可见，255 为完全不透明。
# 例如 255,255,255,128 为半透明白色；四个值均需保留。

# 文字与面板
# 默认文字颜色；部分覆盖层会为特定文字使用单独的颜色。
text_color=191,191,74,230

# 已勾选复选框中的勾选标记。
check_mark_color=189,189,74,230

# 面板背景。
bg_color=26,26,26,77

# 面板边框。
border_color=255,255,255,64

# 按钮：普通、鼠标悬停、按住/按下状态。
button_color=13,13,13,112
button_hover_color=48,48,48,112
button_press_color=51,56,59,230

# 可展开的树节点行：普通、鼠标悬停、按住/按下状态。
node_color=0,0,0,133
node_hover_color=0,0,0,92
node_press_color=51,56,59,84

# 滚动条
# 轨道背景。
scroll_bg_color=13,13,13,112

# 可拖动的滑块：普通、鼠标悬停、按住/按下状态。
scroll_color=87,87,87,112
scroll_hover_color=102,102,102,112
scroll_press_color=143,143,143,112

# 面板尺寸样式
# 窗口边框宽度，单位为像素；填写非负数，0 表示不显示边框。
border_width=1

# 窗口圆角半径，单位为像素；填写非负数，0 表示直角。
rounding=7
